<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Confirm it is you</title>
</head>
<body style="margin:0;padding:0;background:#f8fafc;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;">
  <table role="presentation" width="100%" cellspacing="0" cellpadding="0" style="background:#f8fafc;padding:24px 12px;">
    <tr>
      <td align="center">
        <table role="presentation" width="560" cellspacing="0" cellpadding="0" style="max-width:560px;width:100%;background:#ffffff;border:1px solid #e2e8f0;border-radius:12px;">
          <tr>
            <td style="padding:32px;">
              <p style="margin:0 0 16px;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#5170ff;">Provvypay</p>
              <h1 style="margin:0 0 12px;font-size:22px;line-height:1.3;color:#0f172a;">Confirm it is you</h1>
              <p style="margin:0 0 20px;font-size:15px;line-height:1.6;color:#475569;">Use this Provvypay verification code to confirm a sensitive account change. It expires shortly.</p>
              <p style="margin:0 0 24px;font-size:28px;letter-spacing:.24em;font-weight:700;color:#0f172a;">{{ .Token }}</p>
              <p style="margin:0;font-size:12px;line-height:1.5;color:#94a3b8;">If you did not request this email, you can ignore it. Need help? Contact support@provvypay.com.</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
