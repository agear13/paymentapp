[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc_version = "0.8.24"
optimizer = true
optimizer_runs = 200
ffi = false
fs_permissions = [{ access = "read", path = "./" }]

[rpc_endpoints]
xlayer_testnet = "https://testrpc.xlayer.tech/terigon"

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = false
